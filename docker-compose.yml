services:

  # ── Node.js Backend (Express 5, port 8000) ─────────────────────────────────
  backend:
    build:
      context: ./Backend
    env_file:
      - ./.env
    ports:
      - "8080:8000"   # CHANGED: host 8000 was unavailable, now mapped to 8080
    environment:
      PORT: "8000"
      # Internal service URLs (Docker service names)
      FRONTEND_URL: "http://localhost"
      PYTHON_SERVICE_URL: "http://python:8001"
      BACKEND_URL: "http://localhost:8080"   # CHANGED: matches new host port, for CORS/browser-facing URL
    depends_on:
      python:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Unchanged on purpose — this runs INSIDE the container against its own
      # internal listening port (8000), not the host-published port.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/api/test', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Python Services (FastAPI, port 8001) ───────────────────────────────────
  python:
    build:
      context: ./Python_Services
    shm_size: '256mb'     
    env_file:
      - ./.env
    ports:
      - "8001:8001"
    environment:
      SERVICE_HOST: "0.0.0.0"
      SERVICE_PORT: "8001"
      BACKEND_URL: "http://backend:8000"   # Unchanged — container-to-container, uses Docker service name + internal port
      SCRAPER_HEADLESS: "true"
      # Map PG* vars from root .env to POSTGRES_* names that Python service expects
      POSTGRES_HOST: "${PGHOST}"
      POSTGRES_PORT: "${PGPORT}"
      POSTGRES_DB: "${PGDATABASE}"
      POSTGRES_USER: "${PGUSER}"
      POSTGRES_PASSWORD: "${PGPASSWORD}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL}"
      OLLAMA_MODEL: "${OLLAMA_MODEL}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Next.js Frontend (port 3000) ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        # Passed at build time so next.config.ts can use it during `next build`
        # Unchanged — server-side build-time reference, container-to-container
        BACKEND_URL: "http://backend:8000"
        # Browser-side: must be the host-accessible URL (via Docker port mapping)
        NEXT_PUBLIC_BACKEND_URL: "http://localhost"
        JWT_SECRET: "${JWT_SECRET}"
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: "production"
      # Also passed at runtime — next.config.ts rewrites() reads this on startup
      # Unchanged — this is server-side (SSR/rewrites), stays container-to-container
      BACKEND_URL: "http://backend:8000"
      JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Local PostgreSQL with pgvector ──────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: