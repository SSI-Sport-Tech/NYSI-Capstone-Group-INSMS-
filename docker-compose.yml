services:

  # ── Node.js Backend (Express 5, port 8000) ─────────────────────────────────
  backend:
    build:
      context: ./Backend
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      # Internal service URLs (Docker service names)
      FRONTEND_URL: "http://localhost:3000"
      PYTHON_SERVICE_URL: "http://python:8001"
    depends_on:
      python:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/api/test', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Python Services (FastAPI, port 8001) ───────────────────────────────────
  python:
    build:
      context: ./Python_Services
    env_file:
      - ./.env
    ports:
      - "8001:8001"
    environment:
      SERVICE_HOST: "0.0.0.0"
      SERVICE_PORT: "8001"
      BACKEND_URL: "http://backend:8000"
      SCRAPER_HEADLESS: "true"
      # Map PG* vars from root .env to POSTGRES_* names that Python service expects
      POSTGRES_HOST: "${PGHOST}"
      POSTGRES_PORT: "${PGPORT}"
      POSTGRES_DB: "${PGDATABASE}"
      POSTGRES_USER: "${PGUSER}"
      POSTGRES_PASSWORD: "${PGPASSWORD}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Next.js Frontend (port 3000) ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        # Server-side rewrite proxy: Next.js rewrites /api/* to this internal URL
        BACKEND_URL: "http://backend:8000"
        # Browser-side: must be the host-accessible URL (via Docker port mapping)
        NEXT_PUBLIC_BACKEND_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
      # Also passed at runtime — next.config.ts rewrites() reads this on startup
      BACKEND_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Optional: Local PostgreSQL with pgvector ────────────────────────────────
